[Debug]
; 0=Trace 1=Debug 2=Info 3=Warning 4=Error 5=Critical 6=Off - ships at Trace by default
; so a submitted log carries full detail without asking first.
uLogLevel=0

[Difficulty]
; Off by default - matches the original mod's own apparent default (inert until you turn it on
; in the settings page). Every value below is Skyrim's own real vanilla default, so nothing
; changes about difficulty until you enable this and change a value.
bEnabled=0

fToPCVE=0.5
fToPCE=0.75
fToPCN=1
fToPCH=1.5
fToPCVH=2
fToPCL=3

fByPCVE=2
fByPCE=1.5
fByPCN=1
fByPCH=0.75
fByPCVH=0.5
fByPCL=0.25

[Regeneration]
; Off by default. Unlike Difficulty above, vanilla has no per-difficulty regeneration at all -
; every setting below is ONE real GameSetting, global to every difficulty - so this mod adds the
; per-difficulty behaviour itself: one stored value per difficulty (VE/E/N/H/VH/L, matching
; Difficulty's own suffixes), and whichever one matches your CURRENT difficulty is written into
; the game. Switching difficulty in the game's own Settings menu switches which stored value
; applies, live, with no need to open this mod's page.
bEnabled=0

; Every value below is -1 on a fresh install. That is not a real setting - -1 means "not yet
; captured" - and this mod overwrites it with the REAL vanilla value read from YOUR OWN running
; game the first time it loads, for every difficulty. There is no fixed vanilla number to write
; here the way there is for Difficulty above: these settings have no documented default the way
; the twelve damage multipliers do, so the honest source is the game itself, not a guess. Once
; captured, Save writes the real numbers here and they stay editable normally.

; In combat - the three settings this feature exists for.
fCombatHealthRegenRateMultVE=-1
fCombatHealthRegenRateMultE=-1
fCombatHealthRegenRateMultN=-1
fCombatHealthRegenRateMultH=-1
fCombatHealthRegenRateMultVH=-1
fCombatHealthRegenRateMultL=-1

fCombatMagickaRegenRateMultVE=-1
fCombatMagickaRegenRateMultE=-1
fCombatMagickaRegenRateMultN=-1
fCombatMagickaRegenRateMultH=-1
fCombatMagickaRegenRateMultVH=-1
fCombatMagickaRegenRateMultL=-1

fCombatStaminaRegenRateMultVE=-1
fCombatStaminaRegenRateMultE=-1
fCombatStaminaRegenRateMultN=-1
fCombatStaminaRegenRateMultH=-1
fCombatStaminaRegenRateMultVH=-1
fCombatStaminaRegenRateMultL=-1

; After damage - the pause before regeneration resumes.
fDamagedHealthRegenDelayVE=-1
fDamagedHealthRegenDelayE=-1
fDamagedHealthRegenDelayN=-1
fDamagedHealthRegenDelayH=-1
fDamagedHealthRegenDelayVH=-1
fDamagedHealthRegenDelayL=-1

fDamagedMagickaRegenDelayVE=-1
fDamagedMagickaRegenDelayE=-1
fDamagedMagickaRegenDelayN=-1
fDamagedMagickaRegenDelayH=-1
fDamagedMagickaRegenDelayVH=-1
fDamagedMagickaRegenDelayL=-1

fDamagedStaminaRegenDelayVE=-1
fDamagedStaminaRegenDelayE=-1
fDamagedStaminaRegenDelayN=-1
fDamagedStaminaRegenDelayH=-1
fDamagedStaminaRegenDelayVH=-1
fDamagedStaminaRegenDelayL=-1

fDamagedAVRegenDelayVE=-1
fDamagedAVRegenDelayE=-1
fDamagedAVRegenDelayN=-1
fDamagedAVRegenDelayH=-1
fDamagedAVRegenDelayVH=-1
fDamagedAVRegenDelayL=-1

; Not per-difficulty - one value, shared by every difficulty (the delay ceilings only matter
; once a delay above is raised past them; the two situational ones are edge cases, not the
; reason this feature exists).
fHealthRegenDelayMax=-1
fMagickaRegenDelayMax=-1
fStaminaRegenDelayMax=-1
fOutOfBreathStaminaRegenDelay=-1
fEssentialDownCombatHealthRegenMult=-1
